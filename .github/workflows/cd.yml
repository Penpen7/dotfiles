name: CD
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_PROFILE_NAME: builder

jobs:
  copy:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - work
          - personal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Allow GitHub macOS runner ranges through Bot Fight Mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/cf-allow-actions-macos.sh

      - name: Build package
        run: nix build .#darwinConfigurations.${{ matrix.profile }}.system --accept-flake-config

      - name: Sign package with secret key
        env:
          BINARY_CACHE_SECRET_KEY: ${{ secrets.BINARY_CACHE_SECRET_KEY }}
        run: |
          echo $BINARY_CACHE_SECRET_KEY > ./secret.key
          nix store sign --recursive --key-file ./secret.key ./result

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID --profile $AWS_PROFILE_NAME
          nix shell nixpkgs#awscli2 --command aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY --profile $AWS_PROFILE_NAME

      - name: Copy package
        env:
          S3_API_ENDPOINT: ${{ secrets.S3_API_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: nix copy --to "s3://$S3_BUCKET?profile=$AWS_PROFILE_NAME&endpoint=$S3_API_ENDPOINT&region=auto&compression=zstd" ./result

  cleanup-allow-rules:
    needs: copy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Remove Bot Fight Mode allow rules when no other CI/CD is running
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/cf-allow-actions-macos.sh cleanup

  upload-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The landing page lives next to the store paths in the same bucket, so
      # https://nix.u-naoki.com/index.htm is served by the R2 custom domain.
      - name: Upload landing page
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          S3_API_ENDPOINT: ${{ secrets.S3_API_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 cp site/index.htm "s3://$S3_BUCKET/index.htm" \
            --endpoint-url "$S3_API_ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"
