name: CD
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_PROFILE_NAME: builder
  AWS_DEFAULT_REGION: auto

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-cache:
    if: vars.NIX_CACHE_BUCKET != ''
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - work
          - personal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = ${{ vars.NIX_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Write cache signing key
        id: signing-key
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY}" ]]; then
            echo "::error::NIX_CACHE_SIGNING_KEY secret is not set"
            exit 1
          fi
          keyfile="${RUNNER_TEMP}/nix-cache-key"
          umask 077
          printf '%s' "${SIGNING_KEY}" > "${keyfile}"
          echo "keyfile=${keyfile}" >> "${GITHUB_OUTPUT}"

      - name: Configure R2 credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.aws"
          cat > "${HOME}/.aws/credentials" <<EOF
          [${AWS_PROFILE_NAME}]
          aws_access_key_id = ${R2_ACCESS_KEY_ID}
          aws_secret_access_key = ${R2_SECRET_ACCESS_KEY}
          EOF

      - name: Build darwin system (${{ matrix.profile }})
        id: build
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths --accept-flake-config \
            ".#darwinConfigurations.${{ matrix.profile }}.system")
          echo "out=${out}" >> "${GITHUB_OUTPUT}"
          nix path-info --closure-size --human-readable "${out}"

      - name: Push closure to binary cache
        env:
          BUCKET: ${{ vars.NIX_CACHE_BUCKET }}
          ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          KEYFILE: ${{ steps.signing-key.outputs.keyfile }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          nix copy \
            --to "s3://${BUCKET}?profile=${AWS_PROFILE_NAME}&endpoint=${ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto&compression=zstd&priority=30&secret-key=${KEYFILE}" \
            "${OUT}"
