name: CD
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_PROFILE_NAME: builder

jobs:
  copy:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - work
          - personal
    outputs:
      id-work: ${{ steps.cf-allow.outputs.id-work }}
      id-personal: ${{ steps.cf-allow.outputs.id-personal }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Allow runner IP through Bot Fight Mode
        id: cf-allow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          ip=$(curl -4fsS https://www.cloudflare.com/cdn-cgi/trace | awk -F= '/^ip=/{print $2}')
          id=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/firewall/access_rules/rules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"mode\":\"whitelist\",\"configuration\":{\"target\":\"ip\",\"value\":\"$ip\"},\"notes\":\"github-actions run ${{ github.run_id }}\"}" \
            | jq -r '.result.id // empty')
          echo "id-${{ matrix.profile }}=$id" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: nix build .#darwinConfigurations.${{ matrix.profile }}.system --accept-flake-config

      - name: Sign package with secret key
        env:
          BINARY_CACHE_SECRET_KEY: ${{ secrets.BINARY_CACHE_SECRET_KEY }}
        run: |
          echo $BINARY_CACHE_SECRET_KEY > ./secret.key
          nix store sign --recursive --key-file ./secret.key ./result

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli --command aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID --profile $AWS_PROFILE_NAME
          nix shell nixpkgs#awscli --command aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY --profile $AWS_PROFILE_NAME

      - name: Copy package
        env:
          S3_API_ENDPOINT: ${{ secrets.S3_API_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: nix copy --to "s3://$S3_BUCKET?profile=$AWS_PROFILE_NAME&endpoint=$S3_API_ENDPOINT&region=auto&compression=zstd" ./result

  remove-allowed-ips:
    needs: copy
    if: always()
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Remove this run's IPs from Bot Fight Mode allow list
        run: |
          printf '%s\n' "${{ needs.copy.outputs.id-work }}" "${{ needs.copy.outputs.id-personal }}" \
            | awk 'NF && !seen[$0]++' \
            | while read -r id; do
                curl -fsS -X DELETE "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/firewall/access_rules/rules/$id" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /dev/null
              done
