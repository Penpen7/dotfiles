name: CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: nix flake check
        run: nix flake check --all-systems

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: nix fmt
        run: nix fmt
      - name: Check formatting diff
        run: git diff --exit-code

  build-darwin:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - work
          - personal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Allow runner IP through Bot Fight Mode
        id: cf-allow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          ip=$(curl -4fsS https://www.cloudflare.com/cdn-cgi/trace | awk -F= '/^ip=/{print $2}')
          id=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/firewall/access_rules/rules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"mode\":\"whitelist\",\"configuration\":{\"target\":\"ip\",\"value\":\"$ip\"},\"notes\":\"github-actions run ${{ github.run_id }}\"}" \
            | jq -r '.result.id // empty')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build darwin system (${{ matrix.profile }})
        run: nix build --no-link .#darwinConfigurations.${{ matrix.profile }}.system --accept-flake-config

      - name: Remove runner IP from Bot Fight Mode allow list
        if: always() && steps.cf-allow.outputs.id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X DELETE "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/firewall/access_rules/rules/${{ steps.cf-allow.outputs.id }}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /dev/null

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run script tests
        run: bash scripts/update-pkgs-hash.test.sh
