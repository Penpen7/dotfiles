name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    # 毎日 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get App user info
        id: user-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "email=$id+$name@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: DeterminateSystems/update-flake-lock@fd9359ac79d0e912f1b4b947a48470b3e2799b56
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update_flake_lock_action
          git-author-name: ${{ steps.user-info.outputs.name }}
          git-author-email: ${{ steps.user-info.outputs.email }}
          git-committer-name: ${{ steps.user-info.outputs.name }}
          git-committer-email: ${{ steps.user-info.outputs.email }}
          pr-title: 'chore: update flake.lock and pkgs hashes'

      # Update the pinned rev/version/hash of pkgs/*.nix (not flake inputs, so
      # `nix flake update` does not touch them) and fold the result into the
      # same PR branch the action just created. Skips cleanly when the action
      # made no flake.lock change (no PR branch exists).
      - name: Update pkgs hashes on the PR branch
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.user-info.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.user-info.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.user-info.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.user-info.outputs.email }}
        run: |
          set -euo pipefail
          branch=update_flake_lock_action
          if ! git fetch origin "$branch"; then
            echo "No $branch branch (flake.lock unchanged); skipping pkgs update."
            exit 0
          fi
          git checkout -f -B "$branch" FETCH_HEAD
          ./scripts/update-pkgs-hash.sh
          if git diff --quiet -- pkgs; then
            echo "No pkgs hash changes."
          else
            git add pkgs
            git commit -m "chore: update pkgs hashes"
            git push origin "$branch"
          fi
