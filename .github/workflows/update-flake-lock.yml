name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    # 毎日 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get App user info
        id: user-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "email=$id+$name@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: DeterminateSystems/update-flake-lock@fd9359ac79d0e912f1b4b947a48470b3e2799b56
        with:
          token: ${{ steps.app-token.outputs.token }}
          git-author-name: ${{ steps.user-info.outputs.name }}
          git-author-email: ${{ steps.user-info.outputs.email }}
          git-committer-name: ${{ steps.user-info.outputs.name }}
          git-committer-email: ${{ steps.user-info.outputs.email }}
          pr-title: 'chore: update flake.lock'
